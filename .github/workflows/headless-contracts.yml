name: Post-V2 Runtime Contracts

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m compileall -q nurion_post_v2_runtime nurion_character_landmarker/profiles
      - run: python -m pytest
      - run: 'python -c "import nurion_post_v2_runtime; print(''offline-import PASS'')"'
      - run: python tools/post_v2_offline_smoke.py
  release-candidate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python tools/post_v2_release_candidate.py build --output-dir dist/release-candidate
      - run: python tools/post_v2_release_candidate.py verify --manifest dist/release-candidate/SHA256SUMS.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: post-v2-release-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 14
  blender-smoke:
    # This remains SKIPPED until repository configuration explicitly supplies Blender.
    if: ${{ vars.NURION_BLENDER_CI == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: command -v blender || (echo 'Blender validation required but unavailable' && exit 1)
      - run: blender --background --version
  release:
    # Release publication has no PR or manual-dispatch path. A v* tag must name
    # the current main commit.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [test, release-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Authorize only main-derived explicit release refs
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: post-v2-release-candidate-${{ github.sha }}
          path: dist/release-candidate
      - name: Re-verify release inputs
        run: python tools/post_v2_release_candidate.py verify --manifest dist/release-candidate/SHA256SUMS.json
      - name: Publish explicit GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --generate-notes dist/release-candidate/*
